name: P16 R4 Nav Layout Fix

on:
  push:
    branches:
      - preview/p16-s4-r4-nav
    paths:
      - '.github/workflows/p16-nav-layout-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/p16-s4-r4-nav
          fetch-depth: 0
      - run: python3 .github/p16_nav_layout_fix.py
      - name: Verify nav contract
        shell: bash
        run: |
          grep -q 'class="topnav"' public/p16-s4-cloud-acceptance.html
          grep -q 'S4 R4 REVIEW' public/p16-s4-cloud-acceptance.html
          ! grep -q '<aside class="rail"><div class="logo">HV</div><button class="nav active"' public/p16-s4-cloud-acceptance.html
      - name: Commit patch and cleanup
        shell: bash
        run: |
          git config user.name 'P16 Cloud Acceptance'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/p16_nav_layout_fix.py .github/workflows/p16-nav-layout-fix-once.yml
          git add public/p16-s4-cloud-acceptance.html
          git commit -m 'refine: move P16 primary navigation to shared top bar'
          git push origin HEAD:preview/p16-s4-r4-nav
