name: P14 iOS Simulator Build

on:
  push:
    branches:
      - preview/p14-r1-r4
    paths:
      - 'ios/P14Design/**'
      - '.github/workflows/p14-ios-simulator.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/P14Design/project.yml

      - name: Build iOS Simulator app
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/P14Design/P14Design.xcodeproj \
            -scheme P14Design \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log

      - name: Package Appetize artifact
        run: |
          APP_PATH="build/Build/Products/Debug-iphonesimulator/P14Design.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" P14Design-simulator.zip
          ls -lh P14Design-simulator.zip

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: P14Design-simulator
          path: P14Design-simulator.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload to Appetize when token configured
        id: appetize
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          if [ -z "$APPETIZE_API_TOKEN" ]; then
            echo "Appetize API token not configured; native artifact was built successfully, upload skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          RESPONSE=$(curl --fail-with-body -sS -X POST https://api.appetize.io/v1/apps \
            -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "file=@P14Design-simulator.zip" \
            -F "platform=ios" \
            -F "note=P14 R1@r4 Design Build ${GITHUB_SHA}" \
            -F "appPermissions.run=public")
          printf '%s' "$RESPONSE" > appetize-response.json
          PUBLIC_KEY=$(python3 -c 'import json; print(json.load(open("appetize-response.json")).get("publicKey", ""))')
          if [ -z "$PUBLIC_KEY" ]; then
            echo "Appetize upload returned no publicKey"
            cat appetize-response.json
            exit 1
          fi
          echo "public_key=$PUBLIC_KEY" >> "$GITHUB_OUTPUT"
          echo "### Appetize P14 Design Build" >> "$GITHUB_STEP_SUMMARY"
          echo "https://appetize.io/app/$PUBLIC_KEY" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: P14Design-xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
