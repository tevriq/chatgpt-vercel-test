name: P16 B Preview One-shot

on:
  push:
    branches:
      - preview/p16-s4-r4-nav
    paths:
      - .github/p16_b_preview_patch.py
      - .github/workflows/p16-b-preview-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/p16-s4-r4-nav
      - name: Apply B preview rebuild
        run: python3 .github/p16_b_preview_patch.py
      - name: Verify B / vertical nav contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h = Path('public/p16-s4-cloud-acceptance.html').read_text()
          assert 'Human-selected B' in h
          assert '<nav class="topnav"' not in h
          assert 'grid-template-columns:94px 1fr' in h
          assert 'linear-gradient(145deg,#edf3f5,#dce7eb)' in h
          assert h.count('data-page="overview"') >= 2  # desktop + mobile
          PY
      - name: Commit and cleanup
        run: |
          rm .github/p16_b_preview_patch.py .github/workflows/p16-b-preview-once.yml
          git config user.name 'P16 Cloud Acceptance'
          git config user.email 'actions@users.noreply.github.com'
          git add public/p16-s4-cloud-acceptance.html .github/p16_b_preview_patch.py .github/workflows/p16-b-preview-once.yml
          git commit -m 'refine: rebuild P16 Stage 4 preview in B balanced dark glass'
          git push origin HEAD:preview/p16-s4-r4-nav
