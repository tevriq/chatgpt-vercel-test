<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>P14 · Entry Inbox Prototype</title>
<style>
:root{--bg:#f2f2f7;--surface:#fff;--text:#111113;--muted:#737378;--hair:#e7e7eb;--blue:#0a84ff;--green:#30d158;--purple:#8e5af7;--orange:#ff9f0a;--red:#ff453a;--shadow:0 22px 70px rgba(0,0,0,.18);--radius:30px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif;background:#dddde3;color:var(--text)}button,input{font:inherit}.stage{min-height:100vh;display:grid;place-items:center;padding:28px}.phone{width:min(430px,100vw);height:min(900px,calc(100vh - 56px));background:var(--bg);border-radius:44px;overflow:hidden;position:relative;box-shadow:var(--shadow);border:8px solid #19191b}.phone::before{content:"";position:absolute;z-index:50;top:8px;left:50%;transform:translateX(-50%);width:116px;height:30px;border-radius:18px;background:#111}.app{height:100%;display:flex;flex-direction:column;overflow:hidden}.statusbar{height:47px;padding:13px 24px 0;font-size:13px;font-weight:650;display:flex;justify-content:space-between;align-items:flex-start}.nav{display:flex;align-items:center;justify-content:space-between;padding:7px 18px 8px}.title{font-size:34px;font-weight:760;letter-spacing:-.8px}.menu{width:38px;height:38px;border:0;border-radius:19px;background:transparent;font-size:25px;line-height:1}.content{flex:1;overflow:auto;overscroll-behavior:contain;padding:0 12px 122px;scrollbar-width:none}.content::-webkit-scrollbar{display:none}.pull-zone{height:0;overflow:hidden;transition:height .25s ease}.search-wrap{padding:0 3px 12px}.search{width:100%;border:0;background:#e5e5ea;border-radius:12px;padding:10px 14px;font-size:16px;outline:none}.list{display:flex;flex-direction:column;gap:8px}.row{background:rgba(255,255,255,.82);backdrop-filter:blur(18px);border-radius:18px;padding:14px 14px 12px;display:grid;grid-template-columns:28px 1fr 26px;gap:8px;align-items:start;box-shadow:0 1px 0 rgba(0,0,0,.035);transform-origin:center;transition:transform .28s ease,opacity .28s ease,max-height .35s ease,margin .35s ease,padding .35s ease}.row.removing{transform:translateX(44px) scale(.98);opacity:0;max-height:0;margin:0;padding-top:0;padding-bottom:0}.check{width:23px;height:23px;border:2px solid #c7c7cc;border-radius:50%;background:transparent;margin-top:1px;position:relative}.check.done{border-color:var(--blue);background:var(--blue)}.check.done:after{content:"✓";position:absolute;color:#fff;font-weight:800;font-size:14px;left:4px;top:0}.body{font-size:16.5px;line-height:1.35;letter-spacing:-.15px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.pill{font-size:12px;font-weight:560;padding:4px 7px;border-radius:8px;background:#ededf2;color:#55555a;display:inline-flex;align-items:center;gap:3px}.pill.project{background:#e9f3ff;color:#1968b4}.pill.ai{background:#f1eaff;color:#6d3bd1}.pill.time{background:#fff1db;color:#9a5d00}.pill.attach{background:#eef0f4;color:#666}.sync{font-size:12px;color:#a0a0a7;padding-top:2px;font-weight:700;letter-spacing:-2px}.empty{display:none;padding:70px 40px;text-align:center;color:var(--muted)}.bottom{position:absolute;left:0;right:0;bottom:0;height:102px;background:linear-gradient(to top,rgba(242,242,247,1) 70%,rgba(242,242,247,.45),transparent);padding:33px 16px 12px;display:flex;align-items:end;justify-content:center}.tabs{height:52px;width:260px;background:rgba(255,255,255,.84);backdrop-filter:blur(22px);border-radius:18px;display:grid;grid-template-columns:1fr 1fr;padding:4px;box-shadow:0 8px 26px rgba(0,0,0,.08)}.tab{border:0;border-radius:14px;background:transparent;color:#808087;font-weight:650}.tab.active{background:#fff;color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.08)}.add{position:absolute;right:19px;bottom:82px;width:52px;height:52px;border-radius:26px;border:0;background:#111;color:#fff;font-size:31px;box-shadow:0 8px 22px rgba(0,0,0,.22);transition:transform .16s ease}.add:active{transform:scale(.93)}.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.12);opacity:0;pointer-events:none;transition:.25s;z-index:60}.sheet-backdrop.show{opacity:1;pointer-events:auto}.sheet{position:absolute;z-index:70;left:8px;right:8px;bottom:8px;min-height:360px;background:rgba(251,251,253,.98);backdrop-filter:blur(30px);border-radius:30px;padding:10px 16px 16px;transform:translateY(calc(100% + 20px));transition:transform .36s cubic-bezier(.22,.8,.24,1);box-shadow:0 -15px 60px rgba(0,0,0,.16)}.sheet.show{transform:translateY(0)}.grabber{width:38px;height:5px;border-radius:3px;background:#d1d1d6;margin:0 auto 14px}.draft-label{font-size:12px;color:#8e8e93;text-align:center;height:16px}.editor{min-height:118px;border-radius:18px;background:#fff;padding:16px 15px;font-size:18px;line-height:1.42;outline:none;border:1px solid #ededf2;position:relative;overflow:hidden}.editor:empty:before{content:"写点什么，或者按住说…";color:#aaaab0}.editor.processing{color:#4d4d52}.editor.processing:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 15%,rgba(142,90,247,.09) 42%,rgba(10,132,255,.10) 52%,transparent 80%);transform:translateX(-120%);animation:sweep 1.1s ease-in-out infinite}.editor.settle{animation:settle .34s ease}.filler{opacity:.25;text-decoration:line-through;text-decoration-thickness:1px;transition:.35s}.tools{display:flex;align-items:center;justify-content:space-between;margin:13px 2px 10px}.toolset{display:flex;gap:8px}.tool{border:0;background:#ededf2;border-radius:12px;padding:8px 11px;color:#555;font-size:14px}.microw{display:flex;align-items:center;gap:10px}.mic{user-select:none;touch-action:none;width:64px;height:64px;border-radius:32px;border:0;background:#111;color:#fff;display:grid;place-items:center;font-size:25px;box-shadow:0 7px 20px rgba(0,0,0,.18);transition:transform .18s ease,background .18s ease,box-shadow .18s ease}.mic.recording{transform:scale(1.14);background:#ff453a;box-shadow:0 0 0 9px rgba(255,69,58,.10),0 12px 28px rgba(255,69,58,.28)}.wave{height:36px;width:120px;display:flex;align-items:center;gap:3px;opacity:.25;transition:.2s}.wave.active{opacity:1}.wave i{display:block;width:3px;height:7px;background:#777;border-radius:3px}.wave.active i{animation:wave .65s ease-in-out infinite alternate}.wave i:nth-child(2n){animation-delay:.12s}.wave i:nth-child(3n){animation-delay:.24s}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.cancel{border:0;background:transparent;color:#717178;padding:10px}.save{border:0;background:#111;color:#fff;border-radius:14px;padding:11px 18px;font-weight:700;opacity:.35;pointer-events:none;transition:.25s}.save.ready{opacity:1;pointer-events:auto}.process-label{font-size:13px;color:#7454c7;display:flex;align-items:center;gap:6px;opacity:0;transform:translateY(3px);transition:.25s}.process-label.show{opacity:1;transform:none}.spark{animation:spin 1.5s linear infinite}.draft-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;min-height:28px}.draft-tags .pill{opacity:0;transform:translateY(6px) scale(.96);animation:pop .32s forwards}.toast{position:absolute;z-index:90;left:50%;bottom:119px;transform:translate(-50%,22px);background:rgba(24,24,26,.94);color:#fff;padding:11px 14px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.28s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}.toast button{border:0;background:transparent;color:#6cb6ff;margin-left:14px;font-weight:720}.settings{position:absolute;z-index:85;right:14px;top:90px;width:225px;background:rgba(255,255,255,.96);backdrop-filter:blur(25px);border-radius:18px;padding:8px;box-shadow:0 14px 45px rgba(0,0,0,.18);opacity:0;transform:scale(.96) translateY(-7px);transform-origin:top right;pointer-events:none;transition:.18s}.settings.show{opacity:1;transform:none;pointer-events:auto}.settings button{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:12px;font-size:15px}.settings button:hover{background:#f2f2f7}.sync-panel{position:absolute;z-index:88;inset:94px 14px auto;background:#fff;border-radius:22px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.22);display:none}.sync-panel.show{display:block}.sync-line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.sync-now{width:100%;border:0;border-radius:14px;background:#111;color:#fff;padding:12px;margin-top:14px;font-weight:700}.closex{position:absolute;right:15px;top:11px;border:0;background:#eeeef2;width:30px;height:30px;border-radius:15px}.note{font-size:12px;color:#8e8e93;margin-top:9px;line-height:1.4}.hint{position:fixed;right:22px;bottom:18px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);padding:10px 12px;border-radius:12px;color:#67676d;font-size:12px;max-width:320px;box-shadow:0 8px 25px rgba(0,0,0,.1)}
@keyframes sweep{to{transform:translateX(120%)}}@keyframes wave{to{height:28px;background:#ff453a}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pop{to{opacity:1;transform:none}}@keyframes settle{0%{filter:blur(1.4px);transform:scale(.997)}100%{filter:none;transform:none}}
@media(max-width:520px){body{background:var(--bg)}.stage{padding:0}.phone{width:100vw;height:100vh;border:0;border-radius:0;box-shadow:none}.phone::before{top:9px}.hint{display:none}.sheet{left:0;right:0;bottom:0;border-radius:30px 30px 0 0}.statusbar{padding-top:14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="app">
      <div class="statusbar"><span>9:41</span><span>●●●  Wi‑Fi  ▰</span></div>
      <div class="nav"><div class="title" id="navTitle">收集箱</div><button class="menu" id="menuBtn">•••</button></div>
      <div class="content" id="content">
        <div class="pull-zone" id="pullZone"><div class="search-wrap"><input class="search" id="search" placeholder="搜索 Entry、标签、项目…" /></div></div>
        <div class="list" id="list"></div>
        <div class="empty" id="empty">这里很安静。<br>新的 Entry 会出现在这里。</div>
      </div>
      <button class="add" id="addBtn" aria-label="新建 Entry">+</button>
      <div class="bottom"><div class="tabs"><button class="tab active" data-view="inbox">收集箱</button><button class="tab" data-view="completed">已完成</button></div></div>
    </div>

    <div class="settings" id="settings">
      <button id="syncSettings">同步与连接</button>
      <button id="tagManage">标签与 AI 建议</button>
      <button>存储空间 · 428 MB</button>
      <button>提醒设置 · 默认 20:00</button>
    </div>

    <div class="sync-panel" id="syncPanel">
      <button class="closex" id="closeSync">×</button>
      <h3 style="margin:0 0 10px">同步与连接</h3>
      <div class="sync-line"><span>本地已保存</span><b id="localCount">6 条</b></div>
      <div class="sync-line"><span>后端已接收</span><b id="remoteCount">5 条</b></div>
      <div class="sync-line"><span>连接</span><span style="color:#30a46c">Mac mini · Gateway</span></div>
      <button class="sync-now" id="syncNow">立即同步</button>
      <div class="note" id="syncNote">平时自动静默同步。只有你主动同步或持续失败时，才展开状态与原因。</div>
    </div>

    <div class="sheet-backdrop" id="backdrop"></div>
    <section class="sheet" id="sheet" aria-modal="true">
      <div class="grabber"></div>
      <div class="draft-label" id="draftLabel"></div>
      <div class="editor" id="editor" contenteditable="true"></div>
      <div class="draft-tags" id="draftTags"></div>
      <div class="tools">
        <div class="toolset"><button class="tool">▧ 照片</button><button class="tool">＋ 文件</button></div>
        <div class="process-label" id="processLabel"><span class="spark">✦</span><span>正在整理</span></div>
      </div>
      <div class="microw">
        <button class="mic" id="mic" aria-label="按住说">◉</button>
        <div class="wave" id="wave">${'<i></i>'.repeat(24)}</div>
      </div>
      <div class="actions"><button class="cancel" id="cancel">取消</button><button class="save" id="save">保存</button></div>
    </section>
    <div class="toast" id="toast">已完成 <button id="undo">撤销</button></div>
  </div>
</div>
<div class="hint">交互提示：点「+」→ 按住黑色麦克风说话 → 松开看 AI 动效。列表向下拉可露出搜索；点圆圈可完成并撤销。</div>
<script>
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
let view='inbox', recording=false, transcriptTimer=null, toastTimer=null, lastCompleted=null, pullStart=null;
const seed=[
{id:1,body:'把 P14 的同步协议接到现有 API Gateway，后端第一版部署在 Mac mini。',tags:[['✦ P14','project'],['产品','ai'],['明天 20:00','time'],['🎤2','attach']],done:false,sync:2,pinned:true},
{id:2,body:'这次在函馆看到海和山连在一起的时候，感觉城市并不需要很大，舒服就够了。',tags:[['✦ 旅行感悟','ai'],['日本','']],done:false,sync:2},
{id:3,body:'检查 USB WAN 拔出以后，P1 是否会正确回到国内出口。',tags:[['P1','project'],['待办','ai'],['今天 20:00','time']],done:false,sync:1},
{id:4,body:'把 AI 自动生成的相似标签合并做成设置里的待处理建议，让用户选择“是”或“否”。',tags:[['P14','project'],['产品想法','ai']],done:false,sync:2},
{id:5,body:'整理大阪语言学校申请需要补充的材料。',tags:[['留学',''],['待办','ai'],['9月6日 20:00','time']],done:true,sync:2,completedAt:5},
{id:6,body:'记录长崎生物公园里卡皮巴拉区域的动线和女儿最喜欢的地方。',tags:[['旅行',''],['记录','ai'],['📷3','attach']],done:true,sync:2,completedAt:4}
];
let entries=JSON.parse(localStorage.getItem('p14_entries')||'null')||seed;
let draft=JSON.parse(localStorage.getItem('p14_draft')||'null');
function persist(){localStorage.setItem('p14_entries',JSON.stringify(entries));}
function tagHtml(t){return `<span class="pill ${t[1]||''}">${t[0]}</span>`}
function render(q=''){
 const rows=entries.filter(e=>view==='inbox'?!e.done:e.done).filter(e=>!q||e.body.toLowerCase().includes(q.toLowerCase())||e.tags.some(t=>t[0].toLowerCase().includes(q.toLowerCase()))).sort((a,b)=>view==='inbox'?((b.pinned?1:0)-(a.pinned?1:0)||b.id-a.id):(b.completedAt||0)-(a.completedAt||0));
 $('#list').innerHTML=rows.map(e=>`<article class="row" data-id="${e.id}"><button class="check ${e.done?'done':''}" aria-label="${e.done?'恢复':'完成'}"></button><div><div class="body">${e.pinned?'⌃ ':''}${e.body}</div><div class="meta">${e.tags.map(tagHtml).join('')}</div></div><div class="sync">${e.sync===2?'✓✓':'✓'}</div></article>`).join('');
 $('#empty').style.display=rows.length?'none':'block';
 $$('.row .check').forEach(btn=>btn.onclick=()=>toggleDone(+btn.closest('.row').dataset.id,btn.closest('.row')));
}
function toggleDone(id,row){const e=entries.find(x=>x.id===id);if(!e)return;if(!e.done){e.done=true;e.completedAt=Date.now();lastCompleted=e.id;persist();row.classList.add('removing');setTimeout(()=>render($('#search').value),320);showToast();}else{e.done=false;delete e.completedAt;persist();row.classList.add('removing');setTimeout(()=>render($('#search').value),320)}}
function showToast(){clearTimeout(toastTimer);$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),4200)}
$('#undo').onclick=()=>{if(lastCompleted){const e=entries.find(x=>x.id===lastCompleted);if(e){e.done=false;delete e.completedAt;persist();render()}lastCompleted=null}$('#toast').classList.remove('show')};
$$('.tab').forEach(t=>t.onclick=()=>{view=t.dataset.view;$$('.tab').forEach(x=>x.classList.toggle('active',x===t));$('#navTitle').textContent=view==='inbox'?'收集箱':'已完成';render($('#search').value)});
function openSheet(){draft=JSON.parse(localStorage.getItem('p14_draft')||'null');$('#editor').innerText=draft?.text||'';$('#draftLabel').textContent=draft?'未保存草稿 · 继续处理':'';$('#draftTags').innerHTML='';$('#save').classList.toggle('ready',!!$('#editor').innerText.trim());$('#sheet').classList.add('show');$('#backdrop').classList.add('show')}
function closeSheet(){stopRecording(false);$('#sheet').classList.remove('show');$('#backdrop').classList.remove('show')}
$('#addBtn').onclick=openSheet;$('#backdrop').onclick=()=>{saveDraft();closeSheet()};
$('#cancel').onclick=()=>{if($('#editor').innerText.trim()&&!confirm('取消并丢弃这条草稿？'))return;localStorage.removeItem('p14_draft');draft=null;closeSheet()};
function saveDraft(){const text=$('#editor').innerText.trim();if(text){draft={text,at:Date.now()};localStorage.setItem('p14_draft',JSON.stringify(draft))}}
$('#editor').addEventListener('input',()=>{$('#save').classList.toggle('ready',!!$('#editor').innerText.trim());saveDraft()});
const raw=['那个 P14 吧，','我觉得明天还是要','把那个同步的问题','弄一下，','然后走 API Gateway，','后端先放 Mac mini。'];
const finalText='明天处理 P14 同步问题，通过 API Gateway 同步到 Mac mini 后端。';
function startRecording(ev){ev.preventDefault();if(recording)return;recording=true;$('#mic').classList.add('recording');$('#wave').classList.add('active');$('#processLabel').classList.remove('show');$('#draftTags').innerHTML='';$('#save').classList.remove('ready');$('#editor').innerText='';let i=0;transcriptTimer=setInterval(()=>{if(i<raw.length){$('#editor').innerText+=raw[i++];saveDraft()}else clearInterval(transcriptTimer)},390)}
function stopRecording(process=true){if(!recording)return;recording=false;clearInterval(transcriptTimer);$('#mic').classList.remove('recording');$('#wave').classList.remove('active');if(process)runAI()}
$('#mic').addEventListener('pointerdown',startRecording);window.addEventListener('pointerup',()=>stopRecording(true));$('#mic').addEventListener('contextmenu',e=>e.preventDefault());
function runAI(){const ed=$('#editor');if(!ed.innerText.trim())ed.innerText='那个 P14 吧，我觉得明天还是要把那个同步的问题弄一下。';ed.contentEditable='false';ed.classList.add('processing');$('#processLabel').classList.add('show');$('#draftLabel').textContent='';setTimeout(()=>{const original=ed.innerText;ed.classList.remove('processing');ed.innerHTML=original.replace(/那个|我觉得|还是要/g,m=>`<span class="filler">${m}</span>`);setTimeout(()=>{ed.innerText=finalText;ed.classList.add('settle');$('#processLabel span:last-child').textContent='整理完成';const tags=[['✦ P14','project'],['待办','ai'],['明天 20:00','time'],['🎤1','attach']];$('#draftTags').innerHTML=tags.map((t,i)=>`<span style="animation-delay:${i*70}ms" class="pill ${t[1]}">${t[0]}</span>`).join('');$('#save').classList.add('ready');ed.contentEditable='true';saveDraft();setTimeout(()=>ed.classList.remove('settle'),400)},560)},1050)}
$('#save').onclick=()=>{const body=$('#editor').innerText.trim();if(!body)return;entries.push({id:Date.now(),body,tags:[['✦ P14','project'],['待办','ai'],['明天 20:00','time'],['🎤1','attach']],done:false,sync:1});persist();localStorage.removeItem('p14_draft');draft=null;closeSheet();render();setTimeout(()=>{const e=entries[entries.length-1];e.sync=2;persist();render()},2200)};
$('#menuBtn').onclick=e=>{e.stopPropagation();$('#settings').classList.toggle('show')};document.addEventListener('click',e=>{if(!$('#settings').contains(e.target)&&e.target!==$('#menuBtn'))$('#settings').classList.remove('show')});
$('#syncSettings').onclick=()=>{$('#settings').classList.remove('show');$('#syncPanel').classList.add('show');updateCounts()};$('#closeSync').onclick=()=>$('#syncPanel').classList.remove('show');
function updateCounts(){const all=entries.length;const remote=entries.filter(e=>e.sync===2).length;$('#localCount').textContent=`${all} 条`;$('#remoteCount').textContent=`${remote} 条`}
$('#syncNow').onclick=()=>{const b=$('#syncNow');b.disabled=true;b.textContent='同步中…';$('#syncNote').textContent='正在通过 Gateway 同步未确认的 Entry…';setTimeout(()=>{entries.forEach(e=>e.sync=2);persist();updateCounts();render($('#search').value);b.disabled=false;b.textContent='同步完成 ✓';$('#syncNote').textContent='全部 Entry 已被后端确认接收。';setTimeout(()=>b.textContent='立即同步',1700)},1300)};
$('#tagManage').onclick=()=>{alert('AI 建议\n\n“旅行想法” 与 “旅行感悟” 很相似，是否合并？\n\n[原型说明] 正式设计会做成设置里的待处理建议列表。')};
$('#search').addEventListener('input',e=>render(e.target.value));
const content=$('#content'),zone=$('#pullZone');content.addEventListener('pointerdown',e=>{if(content.scrollTop<=2)pullStart=e.clientY});content.addEventListener('pointermove',e=>{if(pullStart!=null){const d=Math.max(0,Math.min(64,e.clientY-pullStart));zone.style.height=d+'px'}});content.addEventListener('pointerup',e=>{if(pullStart!=null){const d=e.clientY-pullStart;zone.style.height=d>38?'58px':'0';if(d>38)setTimeout(()=>$('#search').focus(),220);pullStart=null}});
render();
</script>
</body>
</html>
