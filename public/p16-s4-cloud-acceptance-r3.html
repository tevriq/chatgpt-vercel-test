<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P16 Home Vision · Stage 4 R3</title><style>html,body{margin:0;min-height:100%;background:#0d1a26;color:#edf9ff;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.boot{min-height:100vh;display:grid;place-items:center}.boot div{text-align:center}.spinner{width:28px;height:28px;border:2px solid rgba(255,255,255,.2);border-top-color:#37cfff;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 12px}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="boot"><div><div class="spinner"></div>载入 P16 Stage 4 R3…</div></div><script>
(async()=>{
  const response=await fetch('/p16-s4-cloud-acceptance.html',{cache:'no-store'});
  let html=await response.text();
  const old="window.scrollTo({top:0,behavior:'auto'});location.hash=id;";
  const fixed="history.replaceState(null,'',`#${id}`);window.scrollTo({top:0,behavior:'auto'});";
  if(!html.includes(old)) throw new Error('R2 navigation contract not found');
  html=html.replace(old,fixed).replace('Stage 4 Cloud Acceptance · R2','Stage 4 Cloud Acceptance · R3').replace('S4 R2','S4 R3');
  document.open();document.write(html);document.close();
})().catch(err=>{document.body.innerHTML='<div class="boot"><div>R3 加载失败：'+String(err.message)+'</div></div>'});
</script></body></html>
